<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="A silly story generator built with vanilla JavaScript.">
    <title>Silly Story Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!--
Name: Tagnon Kpanou
File: index.html
Date: 29 juillet 2026
GStupid story generator with customizable names/units.
-->

<div>
  <label for="custom-name">Enter custom name:</label>
  <input id="custom-name" type="text" placeholder="" />
</div>
<fieldset>
  <legend>Choose locale:</legend>
  <label for="us">US</label>
  <input id="us" type="radio" name="uk-us" value="us" checked />
  <label for="uk">UK</label>
  <input id="uk" type="radio" name="uk-us" value="uk" />
</fieldset>
<div>
  <button class="generate">Generate random story</button>
</div>
<p class="story"></p>

<script src="main.js"></script>
</body>
</html>
